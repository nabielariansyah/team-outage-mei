<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jadwal Outage PT MEI</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14213d;--mut:#667085;--bd:#dfe3ea;--hd:#1f3864;--g:#92d050;--b:#9dc3e6;--o:#eceff3;--or:#c00000;--ac:#ffc000;--in:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#1a2133;--tx:#e8ecf4;--mut:#98a2b3;--bd:#2b3550;--o:#2b3550;--or:#ff8a8a;--in:#10162a}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#1a2133;--tx:#e8ecf4;--mut:#98a2b3;--bd:#2b3550;--o:#2b3550;--or:#ff8a8a;--in:#10162a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--hd);color:#fff;padding:10px 14px 0;z-index:9}
header h1{margin:0 0 8px;font-size:17px}
nav{display:flex;gap:4px}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:#c9d4ea;padding:9px 4px;font:600 14px inherit;font-family:inherit}
nav button.on{color:#fff;border-color:var(--ac)}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:16px;margin:18px 0 8px}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
label{display:block;font-size:12px;color:var(--mut)}
input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:15px inherit;font-family:inherit}
.nik{flex:0 0 90px}
button.btn{padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 14px inherit;font-family:inherit}
button.pri{background:var(--hd);color:#fff;border-color:var(--hd)}
button.del{flex:0 0 auto;color:var(--or)}
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar input{flex:1}
.date{font-size:19px;font-weight:700;margin:4px 0 12px}
.sec{border-radius:12px;margin-bottom:12px;overflow:hidden;border:1px solid var(--bd);background:var(--card)}
.sec h3{margin:0;padding:9px 12px;display:flex;justify-content:space-between;font-size:15px;color:#1a1a1a}
.sec.sI h3{background:var(--g)}.sec.sII h3{background:var(--b)}.sec.sOFF h3{background:var(--o);color:var(--tx)}
.sec ul{list-style:none;margin:0;padding:0}
.sec li{padding:9px 12px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;gap:8px}
.sec li small{color:var(--mut)}
.sec .none{color:var(--mut);padding:9px 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--mut)}
.day{border:2px solid transparent;border-radius:8px;padding:4px 0;display:flex;flex-direction:column;align-items:center;font-family:inherit;color:#1a1a1a}
.day i{font-style:normal;font-size:11px;opacity:.7}.day b{font-size:13px}
.s-I{background:var(--g);color:#1a1a1a}.s-II{background:var(--b);color:#1a1a1a}.s-III{background:#d9b8f0;color:#1a1a1a}
.s-OFF{background:var(--o);color:var(--or)}
.day.sel{border-color:var(--ac)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:3px;font-size:12px}
th{font-weight:600;color:var(--mut);padding:0 4px}
.chip{border:0;border-radius:6px;min-width:34px;padding:7px 2px;font:700 12px inherit;font-family:inherit}
.hide{display:none}
.sec.sup h3{background:var(--hd);color:#fff}
.su{align-items:center}
.su .chip{flex:0 0 78px;text-align:center;padding:6px 2px}
.su .nm{flex:1;font-weight:600}
.rl{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<header>
<h1>Jadwal Outage PT MEI</h1>
<nav id="nav"></nav>
</header>
<main id="app"></main>
<script>
const DEF={start:"2026-11-01",
emp:[["S1015","Santoso Aji","C","A"],["S1043","Rahmatullah","A","B"],["S1103","Syahrijal","B","A"],["S1014","Iwan Nurdianto","C","B"],["S1108","Abdurrosyid","D","A"],["S1419","Khanet Dias Suganda","D","B"],["S1421","Achmad Fajrul Falah","A","A"],["S1162","Wanda Andriana","A","B"],["S1160","Jumadi Triyatno","C","A"],["S1107","Ahmad Syauqibika","B","B"],["S1303","Supardi","A","A"],["S1156","Kristiawadi","D","B"],["SC1318","Muhammad Ilham P","B","B"]].map(a=>({nik:a[0],nama:a[1],gs:a[2],go:a[3],role:({"Rahmatullah":"Watchman","Abdurrosyid":"Watchman","Khanet Dias Suganda":"Gas Checker","Wanda Andriana":"Gas Checker","Jumadi Triyatno":"Gas Checker","Ahmad Syauqibika":"Watchman"})[a[1]]||""})),
shift:{A:"III III OFF OFF I I II II".split(" "),B:"OFF OFF I I II II III III".split(" "),C:"I I II II III III OFF OFF".split(" "),D:"II II III III OFF OFF I I".split(" ")},
out:{A:"I I I II II II II I".split(" "),B:"II II II I I I I II".split(" ")},
sup:{A:["Rama Iskandar"],B:["Akhmad Bintang D","M Fitra Riantono"],C:["Angga Ardiyantomo"],D:["Sungadi","Sophian Rumboko"]}};
const clone=o=>JSON.parse(JSON.stringify(o));
const S=clone(DEF);
const DN=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const MN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const pad=n=>String(n).padStart(2,"0");
const iso=t=>{const d=new Date(t);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())};
const parse=s=>{const p=s.split("-").map(Number);return Date.UTC(p[0],p[1]-1,p[2])};
const todayT=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())};
const fmt=t=>{const d=new Date(t);return DN[d.getUTCDay()]+", "+d.getUTCDate()+" "+MN[d.getUTCMonth()]+" "+d.getUTCFullYear()};
const R0=Date.UTC(2026,10,1),R1=Date.UTC(2027,9,31);
const mod=(a,n)=>((a%n)+n)%n;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function status(e,t){const i=Math.round((t-parse(S.start))/864e5),sh=S.shift[e.gs],ou=S.out[e.go];
 if(!sh||!ou)return "?";return sh[mod(i,sh.length)]==="OFF"?"OFF":ou[mod(i,ou.length)]}
let tab="cari",sel=todayT(),ci=0,mon=Date.UTC(new Date(sel).getUTCFullYear(),new Date(sel).getUTCMonth(),1);
const TABS=[["cari","Cari Tanggal"],["jadwal","Per Karyawan"]];

function supOn(k){const i=Math.round((sel-parse(S.start))/864e5),g=Object.keys(S.shift).find(x=>S.shift[x][mod(i,S.shift[x].length)]===k);
 return g?{g,n:(S.sup&&S.sup[g])||[]}:null}
function vSup(){
 return `<div class="sec sup"><h3><span>Shift Supervisor</span></h3><ul>`+[["I","Shift I"],["II","Shift II"],["III","Shift III"]].map(([k,l])=>{const r=supOn(k);
  return `<li class="su"><span class="chip s-${k}">${l}</span><span class="nm">${r&&r.n.length?r.n.map(esc).join("<br>"):"-"}</span><small>${r?"Grup "+r.g:""}</small></li>`}).join("")+`</ul></div>`}
function vCari(){
 let h=`<div class="bar"><button class="btn" data-step="-1">‹</button><input type="date" id="d" value="${iso(sel)}"><button class="btn" data-step="1">›</button><button class="btn pri" data-today>Hari Ini</button></div>`;
 h+=`<div class="date">${fmt(sel)}</div>`;
 h+=vSup();
 if(sel<R0||sel>R1)h+=`<p class="mut">Di luar periode 1 Nov 2026 – 31 Okt 2027; pola tetap diteruskan.</p>`;
 [["I","Shift I"],["II","Shift II"],["OFF","OFF"]].forEach(([k,l])=>{
  const a=S.emp.filter(e=>status(e,sel)===k);
  h+=`<div class="sec s${k}"><h3><span>${l}</span><span>${a.length} orang</span></h3>`+(a.length?`<ul>${a.map(e=>`<li><span>${esc(e.nama)}${e.role?` <small class="rl">(${esc(e.role)})</small>`:""}</span><small>${esc(e.nik)}</small></li>`).join("")}</ul>`:`<div class="none">Tidak ada</div>`)+`</div>`});
 const x=S.emp.filter(e=>["III","?"].includes(status(e,sel)));
 if(x.length)h+=`<p class="mut">Perlu dicek pola/grup: ${x.map(e=>esc(e.nama)).join(", ")}</p>`;
 return h}

function vJadwal(){
 if(!S.emp.length)return `<p class="mut">Belum ada karyawan.</p>`;
 if(ci>=S.emp.length)ci=0;
 const e=S.emp[ci],d=new Date(mon),y=d.getUTCFullYear(),m=d.getUTCMonth(),first=d.getUTCDay(),n=new Date(Date.UTC(y,m+1,0)).getUTCDate(),cnt={};
 let c=DN.map(x=>`<div class="wd">${x.slice(0,3)}</div>`).join("")+"<div></div>".repeat(first);
 for(let i=1;i<=n;i++){const t=Date.UTC(y,m,i),s=status(e,t);cnt[s]=(cnt[s]||0)+1;
  c+=`<button class="day s-${s}${t===sel?" sel":""}" data-t="${t}"><i>${i}</i><b>${s}</b></button>`}
 return `<label>Karyawan<select id="ce">${S.emp.map((x,i)=>`<option value="${i}"${i===ci?" selected":""}>${esc(x.nama)}</option>`).join("")}</select></label>
 <div class="mnav"><button class="btn" data-mon="-1">‹</button><strong>${MN[m]} ${y}</strong><button class="btn" data-mon="1">›</button></div>
 <div class="cal">${c}</div>
 <p class="mut">Bulan ini: Shift I ${cnt.I||0} hari · Shift II ${cnt.II||0} hari · OFF ${cnt.OFF||0} hari. Ketuk tanggal untuk melihat siapa saja yang masuk hari itu.</p>`}

function render(){
 $("#nav").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${l}</button>`).join("");
 $("#app").innerHTML=tab==="cari"?vCari():vJadwal()}
function $(s){return document.querySelector(s)}
document.addEventListener("click",ev=>{
 const b=ev.target.closest("button");if(!b)return;const D=b.dataset;
 if(D.tab){tab=D.tab;render();window.scrollTo(0,0)}
 else if(D.step){sel+=+D.step*864e5;render()}
 else if("today" in D){sel=todayT();render()}
 else if(D.mon){const d=new Date(mon);mon=Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+ +D.mon,1);render()}
 else if(D.t){sel=+D.t;tab="cari";render();window.scrollTo(0,0)}});
document.addEventListener("change",ev=>{const t=ev.target;
 if(t.id==="d"&&t.value){sel=parse(t.value);render()}
 else if(t.id==="ce"){ci=+t.value;render()}});
render();
</script>
</body>
</html>
